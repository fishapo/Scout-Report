name: Scout Report Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Release gate
        run: npm run release:check
      - name: Staging smoke (when BASE_URL is configured)
        if: ${{ inputs.environment == 'staging' && vars.STAGING_BASE_URL != '' }}
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
        run: npm run smoke:staging
      - name: Build release artifact
        run: npm run release:artifact
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: scout-report-${{ inputs.environment }}-candidate
          path: release/*
      - name: Verify release artifact checksum
        run: sha256sum -c release/*.sha256
      - name: Capture Phase 18 evidence template
        run: |
          cp docs/operations/PHASE19-LIVE-EVIDENCE.md release/PHASE19-LIVE-EVIDENCE-TEMPLATE.md
          cp docs/operations/PHASE19-RELEASE-RUNBOOK.md release/PHASE19-RELEASE-RUNBOOK.md

      - name: Deployment approval boundary
        run: |
          echo "Environment '${{ inputs.environment }}' passed the source release gate."
          echo "Configure the GitHub Environment's required reviewers and deployment target before enabling the final deploy step."
