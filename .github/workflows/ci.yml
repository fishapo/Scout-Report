name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: scout_report
      DB_USER: scout_user
      DB_PASSWORD: ci-only-postgres-password
      DB_SSL: 'false'
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      RUN_DB_INTEGRATION: '1'
      RUN_DB_TESTS: '1'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scout_report
          POSTGRES_USER: scout_user
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U scout_user -d scout_report'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Apply PostgreSQL migrations
        run: npm run migrate

      - name: Run unit, contract, and database integration tests
        run: npm run test:ci
