<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Management | Scout Report</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7f8;color:#172033}.top{background:#173b2b;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:10px}.main{max-width:1250px;margin:auto;padding:25px}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 5px 20px #0000000d;margin-bottom:18px}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:#1769aa;color:#fff}.danger{background:#b42318;color:#fff}.secondary{background:#eef2f6}.form{display:grid;grid-template-columns:1.2fr 1.2fr 1fr 1fr auto;gap:10px;align-items:end}.field label{display:block;font-size:12px;font-weight:700;color:#667085;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:7px;box-sizing:border-box}.msg{min-height:24px;font-weight:600}.error{color:#b42318}.ok{color:#067647}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #eaecf0;text-align:left;white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:#667085}@media(max-width:850px){.form{grid-template-columns:1fr 1fr}.form .submit{grid-column:1/-1}}@media print{.top button,.form,.actions{display:none}.card{box-shadow:none}}</style></head><body><header class="top"><div><strong>🌿 Scout Report</strong><div>User & Role Management</div></div><div><button class="btn secondary" onclick="location.href='/dashboard.html'">Analytics Dashboard</button><button class="btn danger" onclick="logout()">Logout</button></div></header><main class="main"><section class="card"><h1>Add User</h1><p>Create accounts for Scouts, Inter-Farm Supervisors, Heads of Department or Administrators.</p><form class="form" onsubmit="createUser(event)"><div class="field"><label>Name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Temporary Password</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>Role</label><select id="role"><option value="scout">Field Scout</option><option value="inter_farm_supervisor">Inter-Farm Supervisor</option><option value="head_of_department">Head of Department</option><option value="admin">Administrator</option></select></div><div class="submit"><button class="btn primary">＋ Add User</button></div></form><div id="msg" class="msg"></div></section><section class="card"><h1>Existing Users</h1><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Change Role</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/assets/auth.js"></script><script>const roles=['scout','inter_farm_supervisor','head_of_department','admin'];const labels={scout:'Field Scout',inter_farm_supervisor:'Inter-Farm Supervisor',head_of_department:'Head of Department',admin:'Administrator'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await browserAuth.fetchWithAuth(url,opt);let b=null;try{b=await r.json()}catch{}if(!r.ok)throw new Error(b?.error||`Request failed (${r.status})`);return b}function msg(t,ok=false){const e=document.getElementById('msg');e.textContent=t;e.className='msg '+(ok?'ok':'error')}async function loadUsers(){try{const u=await browserAuth.init({redirectTo:'/login'});if(!u||u.role!=='admin'){location.href='/dashboard';return}const b=await api('/api/admin/users');document.getElementById('rows').innerHTML=b.users.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(labels[x.role]||x.role)}</td><td>${x.is_active?'Active':'Inactive'}</td><td><select id="role-${esc(x.id)}">${roles.map(r=>`<option value="${r}" ${r===x.role?'selected':''}>${labels[r]}</option>`).join('')}</select> <button class="btn primary" onclick="saveRole('${esc(x.id)}')">Save</button></td><td><button class="btn secondary" onclick="resetPassword('${esc(x.id)}','${esc(x.name)}')">Reset Password</button> <button class="btn danger" onclick="deleteUser('${esc(x.id)}','${esc(x.name)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7">No users.</td></tr>';}catch(e){msg(e.message)}}async function createUser(ev){ev.preventDefault();try{await api('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value,role:document.getElementById('role').value})});ev.target.reset();msg('User created successfully.',true);await loadUsers()}catch(e){msg(e.message)}}async function saveRole(id){try{const role=document.getElementById(`role-${id}`).value;await api(`/api/admin/users/${encodeURIComponent(id)}/role`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({role})});msg('Role updated successfully.',true);await loadUsers()}catch(e){msg(e.message)}}async function resetPassword(id,name){const password=prompt(`Enter a new temporary password for ${name} (minimum 8 characters):`);if(password===null)return;if(password.length<8){msg('Password must be at least 8 characters');return}if(!confirm(`Reset password for ${name}? Existing sessions will be signed out.`))return;try{await api(`/api/admin/users/${encodeURIComponent(id)}/password`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});msg('Password reset successfully. The user can now log in with the new password.',true);await loadUsers()}catch(e){msg(e.message)}}async function deleteUser(id,name){if(!confirm(`Delete user ${name}? This cannot be undone.`))return;try{await api(`/api/admin/users/${encodeURIComponent(id)}`,{method:'DELETE'});msg('User deleted.',true);await loadUsers()}catch(e){msg(e.message)}}async function logout(){try{await browserAuth.logout()}catch(e){location.href='/login'}}loadUsers();</script></body></html>
