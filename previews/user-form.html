<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Scout Report</title>

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f5f5f5;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    background:white;
    min-height:100vh;
}

.header{
    background:#2e7d32;
    color:white;
    padding:25px;
}

.header h1{
    font-size:30px;
}

.content{
    padding:20px;
}

.section{
    background:#fafafa;
    padding:20px;
    margin-bottom:20px;
    border-radius:8px;
    border:1px solid #ddd;
}

.section h2{
    margin-bottom:15px;
    color:#2e7d32;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

textarea{
    resize:vertical;
    min-height:80px;
}

button{
    cursor:pointer;
}

.submit-btn{

    width:100%;
    background:#2e7d32;
    color:white;
    border:none;
    padding:16px;
    font-size:18px;
    border-radius:8px;
}

.submit-btn:hover{
    background:#1b5e20;
}

.add-btn{

    background:#2e7d32;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:6px;
}

.remove-btn{

    background:#d32f2f;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
}

.card{

    background:white;
    border:1px solid #ddd;
    padding:15px;
    margin-top:15px;
    border-radius:8px;
}

.location{
    background:#eee;
    padding:12px;
    border-radius:6px;
}

.switch-group{

    display:flex;
    gap:10px;
    margin-top:10px;
}

.switch-btn{

    flex:1;
    padding:12px;
    border:1px solid #aaa;
    background:white;
}

.switch-btn.active{

    background:#2e7d32;
    color:white;
}

    </style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Scout Report</h1>

<p id="report-date"></p>

</div>

<div class="content">

<!-- FARM -->

<div class="section">

<h2>Farm Information</h2>

<label>Farm</label>

<select id="farm-select">

<option value="">Select Farm</option>

</select>

<label>Greenhouse</label>

<div class="switch-group">

<button
type="button"
class="switch-btn active"
data-greenhouse="false"
onclick="toggleSwitch(this)">

Field

</button>

<button
type="button"
class="switch-btn"
data-greenhouse="true"
onclick="toggleSwitch(this)">

Greenhouse

</button>

</div>

</div>

<!-- CROP -->

<div class="section">

<h2>Crop Information</h2>

<label>Crop</label>

<select
id="crop-select"
onchange="updateVarieties(this)">

<option value="">Select Crop</option>

</select>

<label>Variety</label>

<select id="variety-select">

<option value="">Select Variety</option>

</select>

<label>Implementation Week</label>

<input
type="number"
id="implementation-week">

<label>Implementation Year</label>

<input
type="number"
id="implementation-year"
value="2026">

</div>

<!-- ENVIRONMENT -->

<div class="section">

<h2>Environment</h2>

<label>Weather</label>

<select id="weather">

<option>Sunny</option>
<option>Cloudy</option>
<option>Rainy</option>
<option>Windy</option>

</select>

<label>Temperature</label>

<input
type="number"
id="temperature">

<label>Humidity</label>

<input
type="number"
id="humidity">

<label>Location</label>

<div class="location">

<div id="lat-display">

Latitude : --

</div>

<div id="long-display">

Longitude : --

</div>

<br>

<button
type="button"
class="add-btn"
onclick="updateLocation()">

Update GPS

</button>

</div>

</div>

<!-- PEST -->

<div class="section">

<h2>

Pest Observations

<button
type="button"
class="add-btn"
onclick="addPestObservation()">

Add

</button>

</h2>

<div id="pest-observations">

</div>

</div>

<!-- DISEASE -->

<div class="section">

<h2>

Disease Observations

<button
type="button"
class="add-btn"
onclick="addDiseaseObservation()">

Add

</button>

</h2>

<div id="disease-observations">

</div>

</div>

<!-- NOTES -->

<div class="section">

<h2>Notes</h2>

<textarea
id="notes">

</textarea>

</div>

<button
id="submit-btn"
class="submit-btn"
onclick="submitReport()">

Submit Scout Report

</button>

</div>

</div>

<script>
    const API = "http://localhost:3000/api";

let farms = [];
let cropTypes = [];
let varieties = {};
let pests = [];
let diseases = [];
let currentLocation = null;

document.addEventListener("DOMContentLoaded", async () => {

    document.getElementById("report-date").textContent =
        new Date().toLocaleDateString();

    await loadReferenceData();

    addPestObservation();
    addDiseaseObservation();

});

async function loadReferenceData() {

    try {

        const response = await fetch(`${API}/reference`);

        if (!response.ok)
            throw new Error("Unable to load reference data");

        const data = await response.json();

        farms = data.farms || [];
        cropTypes = data.cropTypes || [];
        varieties = data.varieties || {};
        pests = data.pests || [];
        diseases = data.diseases || [];

        populateSelect(
            document.getElementById("farm-select"),
            farms,
            "name",
            "id"
        );

        populateSelect(
            document.getElementById("crop-select"),
            cropTypes,
            "name",
            "id"
        );

    } catch (err) {

        console.error(err);
        alert(err.message);

    }

}

function populateSelect(select, items, labelKey, valueKey) {

    select.innerHTML =
        '<option value="">Select...</option>';

    items.forEach(item => {

        const option =
            document.createElement("option");

        option.value = item[valueKey];
        option.textContent = item[labelKey];

        select.appendChild(option);

    });

}

function updateVarieties(select) {

    const varietySelect =
        document.getElementById("variety-select");

    varietySelect.innerHTML =
        '<option value="">Select Variety</option>';

    const list =
        varieties[select.value] || [];

    list.forEach(v => {

        const option =
            document.createElement("option");

        option.value = v;
        option.textContent = v;

        varietySelect.appendChild(option);

    });

}

function toggleSwitch(button){

    document
        .querySelectorAll(".switch-btn")
        .forEach(btn=>btn.classList.remove("active"));

    button.classList.add("active");

}

function updateLocation(){

    if(!navigator.geolocation){

        alert("GPS not supported");
        return;

    }

    navigator.geolocation.getCurrentPosition(pos=>{

        currentLocation={

            latitude:pos.coords.latitude,
            longitude:pos.coords.longitude

        };

        document.getElementById("lat-display").textContent =
            "Latitude : " + currentLocation.latitude.toFixed(6);

        document.getElementById("long-display").textContent =
            "Longitude : " + currentLocation.longitude.toFixed(6);

    });

}
let pestCount = 0;
let diseaseCount = 0;

function addPestObservation() {

    pestCount++;

    const container =
        document.getElementById("pest-observations");

    const card =
        document.createElement("div");

    card.className = "observation-card";

    card.innerHTML = `

        <div class="observation-header">
            <span class="observation-index">Pest #${pestCount}</span>

            <button type="button"
                class="delete-btn"
                onclick="removeObservation(this)">
                ✕
            </button>
        </div>

        <label class="label">Pest</label>

        <select class="pest-type-select">
            <option value="">Select Pest</option>

            ${pests.map(p=>`
                <option value="${p}">
                    ${p}
                </option>
            `).join("")}

        </select>

        <label class="label">Count</label>

        <input
            type="number"
            class="pest-count"
            min="0">

        <label class="label">Severity</label>

        <select class="pest-severity">

            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
            <option>Critical</option>

        </select>

        <label class="label">Affected (%)</label>

        <input
            type="number"
            class="affected-percent"
            min="0"
            max="100">

        <label class="label">Location on Plant</label>

        <input
            type="text"
            class="plant-location">

        <label class="label">Notes</label>

        <textarea class="notes"></textarea>

    `;

    container.appendChild(card);

}

function addDiseaseObservation() {

    diseaseCount++;

    const container =
        document.getElementById("disease-observations");

    const card =
        document.createElement("div");

    card.className = "observation-card";

    card.innerHTML = `

        <div class="observation-header">
            <span class="observation-index">
                Disease #${diseaseCount}
            </span>

            <button
                type="button"
                class="delete-btn"
                onclick="removeObservation(this)">
                ✕
            </button>

        </div>

        <label class="label">Disease</label>

        <select class="disease-type-select">

            <option value="">Select Disease</option>

            ${diseases.map(d=>`
                <option value="${d}">
                    ${d}
                </option>
            `).join("")}

        </select>

        <label class="label">Severity</label>

        <select class="disease-severity">

            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
            <option>Critical</option>

        </select>

        <label class="label">Affected (%)</label>

        <input
            type="number"
            class="affected-percent"
            min="0"
            max="100">

        <label class="label">Spot Count</label>

        <input
            type="number"
            class="spot-count">

        <label class="label">Spot Color</label>

        <input
            type="text"
            class="spot-color">

        <label class="label">Notes</label>

        <textarea class="notes"></textarea>

    `;

    container.appendChild(card);

}

function removeObservation(button){

    const card =
        button.closest(".observation-card");

    card.remove();

}
function collectPestObservations(){

    return Array.from(
        document.querySelectorAll(
            "#pest-observations .observation-card"
        )
    ).map(card=>({

        pestType:
            card.querySelector(".pest-type-select").value,

        count:
            Number(card.querySelector(".pest-count").value),

        severity:
            card.querySelector(".pest-severity").value,

        affectedPercent:
            Number(card.querySelector(".affected-percent").value),

        locationOnPlant:
            card.querySelector(".plant-location").value,

        notes:
            card.querySelector(".notes").value

    }));

}

function collectDiseaseObservations(){

    return Array.from(
        document.querySelectorAll(
            "#disease-observations .observation-card"
        )
    ).map(card=>({

        diseaseType:
            card.querySelector(".disease-type-select").value,

        severity:
            card.querySelector(".disease-severity").value,

        affectedPercent:
            Number(card.querySelector(".affected-percent").value),

        spotCount:
            Number(card.querySelector(".spot-count").value),

        spotColor:
            card.querySelector(".spot-color").value,

        notes:
            card.querySelector(".notes").value

    }));

}
async function submitReport() {

    const farmId =
        document.getElementById("farm-select").value;

    const farm =
        farms.find(f => f.id === farmId);

    const cropId =
        document.getElementById("crop-select").value;

    const crop =
        cropTypes.find(c => c.id === cropId);

    const variety =
        document.getElementById("variety-select").value;

    if (!farmId) {
        alert("Please select a farm.");
        return;
    }

    if (!cropId) {
        alert("Please select a crop.");
        return;
    }

    if (!variety) {
        alert("Please select a variety.");
        return;
    }

    const greenhouseButton =
        document.querySelector(
            "#location-type .switch-btn.active"
        );

    const payload = {

        farm_id: farm.id,

        farm_name: farm.name,

        crop_type: crop.name,

        variety: variety,

        is_greenhouse:
            greenhouseButton.dataset.greenhouse === "true",

        report_date:
            new Date().toISOString().split("T")[0],

        implementation_week:
            Number(
                document.getElementById("impl-week").value
            ),

        implementation_year:
            Number(
                document.getElementById("impl-year").value
            ),

        weather:
            document.getElementById("weather-select").value,

        temperature:
            Number(
                document.getElementById("temperature").value
            ) || null,

        humidity:
            Number(
                document.getElementById("humidity").value
            ) || null,

        location:
            currentLocation,

        notes:
            document.getElementById("general-notes").value,

        status: "Pending",

        pest_observations:
            collectPestObservations(),

        disease_observations:
            collectDiseaseObservations()

    };

    console.log(payload);

    const button =
        document.getElementById("submit-btn");

    button.disabled = true;
    button.textContent = "Submitting...";

    try {

        const response =
            await fetch(
                `${API}/reports`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":"application/json"
                    },

                    body: JSON.stringify(payload)
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.error || "Submission failed"
            );

        }

        alert(
            "Scout Report submitted successfully!"
        );

        console.log(data);

        location.reload();

    }
    catch(err){

        console.error(err);

        alert(err.message);

    }
    finally{

        button.disabled = false;

        button.textContent =
            "✓ Submit Report";

    }

}
